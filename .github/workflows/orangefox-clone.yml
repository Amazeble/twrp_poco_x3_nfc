name: OrangeFox Recovery Source Sync

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  sync-source:
    name: Sync OrangeFox 12.1 Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 git-lfs repo

      - name: Configure Git Setup
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Clone and Sync OrangeFox Source
        run: |
          mkdir -p ~/fox_12.1
          cd ~/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git sync
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1
